<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - FocusTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main Container -->
    <div class="app-container">
        <!-- Sidebar (Desktop) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="bi bi-bullseye"></i>
                    <span>FocusTrack</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
                <a href="my-tasks.html" class="nav-item active" data-page="my-tasks">
                    <i class="bi bi-check2-square"></i>
                    <span>My Task</span>
                </a>
                <a href="today.html" class="nav-item" data-page="today">
                    <i class="bi bi-calendar-day"></i>
                    <span>Today</span>
                </a>
                <a href="projects.html" class="nav-item" data-page="projects">
                    <i class="bi bi-kanban"></i>
                    <span>Project</span>
                </a>
                <a href="profile.html" class="nav-item" data-page="profile">
                    <i class="bi bi-person"></i>
                    <span>Profile</span>
                </a>
            </nav>
        </aside>

        <!-- Top Navbar -->
        <nav class="navbar">
            <div class="navbar-actions">
                <a href="#" class="navbar-icon" title="Notifications">
                    <i class="bi bi-bell"></i>
                </a>
                <div class="user-avatar" title="User Profile">
                    <span>CU</span>
                </div>
                <a href="#" class="navbar-icon" title="Logout">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-container">
                <!-- Page Header -->
                <div class="page-header">
                    <div>
                        <h1 class="page-title">My Tasks</h1>
                        <p class="page-subtitle">Manage all your tasks in one place</p>
                    </div>
                    <button class="btn btn-primary" onclick="window.location.href='create-task.html'">
                        <i class="bi bi-plus-lg"></i>
                        New Task
                    </button>
                </div>

                <!-- Filters and Search -->
                <div class="card">
                    <div class="page-header">
                        <div class="filters-group">
                            <select class="form-select" id="statusFilter">
                                <option value="all">All Status</option>
                                <option value="pending">Pending</option>
                                <option value="in-progress">In Progress</option>
                                <option value="completed">Completed</option>
                            </select>
                            <select class="form-select" id="priorityFilter">
                                <option value="all">All Priority</option>
                                <option value="high">High Priority</option>
                                <option value="medium">Medium Priority</option>
                                <option value="low">Low Priority</option>
                            </select>
                        </div>
                        <div class="search-box">
                            <i class="bi bi-search"></i>
                            <input type="text" id="taskSearch" class="input" placeholder="Search tasks...">
                        </div>
                    </div>
                </div>

                <!-- Tasks Table -->
                <div class="card">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Status</th>
                                <th>Task</th>
                                <th>Priority</th>
                                <th>Due Date</th>
                                <th>Project</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tasksTableBody">
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 48px;">
                                    <div class="loading-spinner">
                                        <i class="bi bi-hourglass-split"></i>
                                        <p>Loading tasks...</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Mobile Header -->
        <header class="mobile-header">
            <div class="mobile-nav">
                <button class="hamburger" id="hamburger">
                    <i class="bi bi-list"></i>
                </button>
                <div class="mobile-logo">
                    <i class="bi bi-check2-square"></i>
                    <span>My Tasks</span>
                </div>
                <div class="mobile-user">
                    <i class="bi bi-person"></i>
                </div>
            </div>
        </header>

        <!-- Mobile Bottom Navigation -->
        <nav class="mobile-nav-footer">
            <a href="dashboard.html" class="nav-item" data-page="dashboard">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
            <a href="my-tasks.html" class="nav-item active" data-page="my-tasks">
                <i class="bi bi-check2-square"></i>
                <span>My Task</span>
            </a>
            <a href="today.html" class="nav-item" data-page="today">
                <i class="bi bi-calendar-day"></i>
                <span>Today</span>
            </a>
            <a href="projects.html" class="nav-item" data-page="projects">
                <i class="bi bi-kanban"></i>
                <span>Project</span>
            </a>
            <a href="profile.html" class="nav-item" data-page="profile">
                <i class="bi bi-person"></i>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <!-- Hidden Content for Mobile Menu -->
    <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadAllTasks();
            setupFilters();
        });

        function loadAllTasks() {
            // Sample tasks for demonstration
            const tasks = [
                { id: 1, title: 'Complete project documentation', status: 'in-progress', priority: 'high', due_date: '2024-03-20', project: 'Website Redesign' },
                { id: 2, title: 'Review pull requests', status: 'completed', priority: 'medium', due_date: '2024-03-18', project: 'Mobile App Development' },
                { id: 3, title: 'Update dependencies', status: 'pending', priority: 'low', due_date: '2024-03-22', project: 'Marketing Campaign' },
                { id: 4, title: 'Design mobile mockups', status: 'pending', priority: 'high', due_date: '2024-03-25', project: 'Website Redesign' },
                { id: 5, title: 'Setup CI/CD pipeline', status: 'pending', priority: 'medium', due_date: '2024-03-28', project: 'Mobile App Development' }
            ];

            displayTasks(tasks);
        }

        function displayTasks(tasks) {
            const tbody = document.getElementById('tasksTableBody');
            
            if (tasks.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 48px;">
                            <div class="empty-state">
                                <i class="bi bi-clipboard2"></i>
                                <p>No tasks found</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = tasks.map(task => `
                <tr>
                    <td>
                        <span class="badge badge-${task.status}">${formatStatus(task.status)}</span>
                    </td>
                    <td>
                        <div class="task-title">${task.title}</div>
                    </td>
                    <td>
                        <span class="badge badge-${task.priority}">${formatPriority(task.priority)}</span>
                    </td>
                    <td>
                        <span>
                            <i class="bi bi-calendar"></i>
                            ${formatDate(task.due_date)}
                        </span>
                    </td>
                    <td>${task.project}</td>
                    <td>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn-icon" onclick="editTask(${task.id})" title="Edit">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn-icon" onclick="deleteTask(${task.id})" title="Delete">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function setupFilters() {
            const statusFilter = document.getElementById('statusFilter');
            const priorityFilter = document.getElementById('priorityFilter');
            const searchInput = document.getElementById('taskSearch');

            statusFilter.addEventListener('change', applyFilters);
            priorityFilter.addEventListener('change', applyFilters);
            searchInput.addEventListener('input', applyFilters);
        }

        function applyFilters() {
            const statusFilter = document.getElementById('statusFilter').value;
            const priorityFilter = document.getElementById('priorityFilter').value;
            const searchTerm = document.getElementById('taskSearch').value.toLowerCase();
            
            console.log('Filters:', { statusFilter, priorityFilter, searchTerm });
            // Apply filter logic here
            loadAllTasks(); // Reload with filters
        }

        function formatStatus(status) {
            const statusMap = {
                'pending': 'Pending',
                'in-progress': 'In Progress',
                'completed': 'Completed'
            };
            return statusMap[status] || status;
        }

        function formatPriority(priority) {
            const priorityMap = {
                'high': 'High',
                'medium': 'Medium',
                'low': 'Low'
            };
            return priorityMap[priority] || priority;
        }

        function formatDate(dateString) {
            if (!dateString) return 'No due date';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function editTask(taskId) {
            console.log('Edit task:', taskId);
            // Edit task logic here
        }

        function deleteTask(taskId) {
            if (confirm('Are you sure you want to delete this task?')) {
                console.log('Delete task:', taskId);
                // Delete task logic here
            }
        }
    </script>

    <style>
        .filters-group {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 300px;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6B7280;
            font-size: 16px;
        }

        .search-box .input {
            padding-left: 44px;
        }

        .task-title {
            font-weight: 600;
            color: #111827;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .filters-group {
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
            }

            .search-box {
                max-width: none;
            }

            .table {
                font-size: 12px;
            }

            .table th,
            .table td {
                padding: 8px;
            }

            .btn-icon {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</body>
</html>
