<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Project - FocusTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main Container -->
    <div class="app-container">
        <!-- Sidebar (Desktop) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="bi bi-bullseye"></i>
                    <span>FocusTrack</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <i class="bi bi-bullseye"></i>
                    <span>Dashboard</span>
                </a>
                <a href="my-tasks.html" class="nav-item" data-page="my-tasks">
                    <i class="bi bi-check2-square"></i>
                    <span>My Task</span>
                </a>
                <a href="today.html" class="nav-item" data-page="today">
                    <i class="bi bi-calendar-day"></i>
                    <span>Today</span>
                </a>
                <a href="projects.html" class="nav-item" data-page="projects">
                    <i class="bi bi-kanban"></i>
                    <span>Project</span>
                </a>
                <a href="profile.html" class="nav-item" data-page="profile">
                    <i class="bi bi-person"></i>
                    <span>Profile</span>
                </a>
            </nav>
        </aside>

        <!-- Top Navbar -->
        <nav class="navbar">
            <div class="navbar-actions">
                <a href="#" class="navbar-icon" title="Notifications">
                    <i class="bi bi-bell"></i>
                </a>
                <div class="user-avatar" title="User Profile">
                    <span>CU</span>
                </div>
                <a href="#" class="navbar-icon" title="Logout">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-container">
                <!-- Page Header -->
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Create New Project</h1>
                        <p class="page-subtitle">Set up a new project to organize your tasks</p>
                    </div>
                    <div>
                        <button class="btn btn-secondary" onclick="window.location.href='projects.html'">
                            <i class="bi bi-arrow-left"></i>
                            Cancel
                        </button>
                    </div>
                </div>

                <!-- Form Card -->
                <div class="form-card">
                    <form id="createProjectForm">
                        <!-- Project Name -->
                        <div class="form-group">
                            <label for="projectName" class="form-label">Project Name *</label>
                            <input type="text" id="projectName" class="input" placeholder="Enter project name" required>
                        </div>

                        <!-- Description -->
                        <div class="form-group">
                            <label for="projectDescription" class="form-label">Description</label>
                            <textarea id="projectDescription" class="form-textarea" placeholder="Add project description and objectives..."></textarea>
                        </div>

                        <!-- Two Column Row -->
                        <div class="form-row">
                            <!-- Status -->
                            <div class="form-group">
                                <label for="projectStatus" class="form-label">Status</label>
                                <select id="projectStatus" class="form-select">
                                    <option value="planning" selected>Planning</option>
                                    <option value="active">Active</option>
                                    <option value="on-hold">On Hold</option>
                                    <option value="completed">Completed</option>
                                </select>
                            </div>

                            <!-- Priority -->
                            <div class="form-group">
                                <label for="projectPriority" class="form-label">Priority</label>
                                <select id="projectPriority" class="form-select">
                                    <option value="low">Low Priority</option>
                                    <option value="medium" selected>Medium Priority</option>
                                    <option value="high">High Priority</option>
                                </select>
                            </div>
                        </div>

                        <!-- Two Column Row -->
                        <div class="form-row">
                            <!-- Start Date -->
                            <div class="form-group">
                                <label for="projectStartDate" class="form-label">Start Date</label>
                                <input type="date" id="projectStartDate" class="input">
                            </div>

                            <!-- End Date -->
                            <div class="form-group">
                                <label for="projectEndDate" class="form-label">End Date</label>
                                <input type="date" id="projectEndDate" class="input">
                            </div>
                        </div>

                        <!-- Two Column Row -->
                        <div class="form-row">
                            <!-- Project Type -->
                            <div class="form-group">
                                <label for="projectType" class="form-label">Project Type</label>
                                <select id="projectType" class="form-select">
                                    <option value="development">Development</option>
                                    <option value="design">Design</option>
                                    <option value="marketing">Marketing</option>
                                    <option value="research">Research</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>

                            <!-- Team Lead -->
                            <div class="form-group">
                                <label for="projectLead" class="form-label">Team Lead</label>
                                <input type="text" id="projectLead" class="input" placeholder="Assign team lead">
                            </div>
                        </div>

                        <!-- Team Members -->
                        <div class="form-group">
                            <label for="projectTeam" class="form-label">Team Members</label>
                            <input type="text" id="projectTeam" class="input" placeholder="Enter team member emails (comma separated)">
                            <small>Separate multiple team members with commas</small>
                        </div>

                        <!-- Budget -->
                        <div class="form-group">
                            <label for="projectBudget" class="form-label">Budget</label>
                            <input type="text" id="projectBudget" class="input" placeholder="Enter project budget (optional)">
                        </div>

                        <!-- Form Actions -->
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-folder-plus"></i>
                                Create Project
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="window.location.href='projects.html'">
                                <i class="bi bi-x-lg"></i>
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <!-- Mobile Header -->
        <header class="mobile-header">
            <div class="mobile-nav">
                <button class="hamburger" id="hamburger">
                    <i class="bi bi-list"></i>
                </button>
                <div class="mobile-logo">
                    <i class="bi bi-folder-plus"></i>
                    <span>Create Project</span>
                </div>
                <div class="mobile-user">
                    <i class="bi bi-person"></i>
                </div>
            </div>
        </header>

        <!-- Mobile Bottom Navigation -->
        <nav class="mobile-nav-footer">
            <a href="dashboard.html" class="nav-item" data-page="dashboard">
                <i class="bi bi-bullseye"></i>
                <span>Dashboard</span>
            </a>
            <a href="my-tasks.html" class="nav-item" data-page="my-tasks">
                <i class="bi bi-check2-square"></i>
                <span>My Task</span>
            </a>
            <a href="today.html" class="nav-item" data-page="today">
                <i class="bi bi-calendar-day"></i>
                <span>Today</span>
            </a>
            <a href="projects.html" class="nav-item" data-page="projects">
                <i class="bi bi-kanban"></i>
                <span>Project</span>
            </a>
            <a href="profile.html" class="nav-item" data-page="profile">
                <i class="bi bi-person"></i>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <!-- Hidden Content for Mobile Menu -->
    <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setupForm();
        });

        function setupForm() {
            const form = document.getElementById('createProjectForm');
            
            // Set minimum date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('projectStartDate').min = today;
            document.getElementById('projectEndDate').min = today;
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                handleFormSubmit();
            });
        }

        function handleFormSubmit() {
            const formData = {
                name: document.getElementById('projectName').value,
                description: document.getElementById('projectDescription').value,
                status: document.getElementById('projectStatus').value,
                priority: document.getElementById('projectPriority').value,
                startDate: document.getElementById('projectStartDate').value,
                endDate: document.getElementById('projectEndDate').value,
                type: document.getElementById('projectType').value,
                lead: document.getElementById('projectLead').value,
                team: document.getElementById('projectTeam').value,
                budget: document.getElementById('projectBudget').value
            };

            console.log('Creating project:', formData);
            
            // Simulate project creation
            alert('Project created successfully!');
            
            // Redirect to projects page
            window.location.href = 'projects.html';
        }
    </script>

    <style>
        /* Form Card */
        .form-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            padding: 28px;
            max-width: 720px;
            margin: 0 auto;
        }

        /* Form Layout */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .form-actions {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #F3F4F6;
        }

        /* Input Field Optimization */
        .input {
            width: 100%;
            height: 48px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            padding: 0 16px;
            font-size: 14px;
            background: #FFFFFF;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.15);
            outline: none;
        }

        /* Textarea */
        .form-textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px 16px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            resize: vertical;
            font-size: 14px;
            font-family: Inter, system-ui, sans-serif;
            line-height: 1.5;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-textarea:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.15);
            outline: none;
        }

        /* Select Fields */
        .form-select {
            width: 100%;
            height: 48px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            padding: 0 16px;
            font-size: 14px;
            background: #FFFFFF;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 12px center;
            background-repeat: no-repeat;
            background-size: 16px;
        }

        .form-select:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.15);
            outline: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .form-card {
                padding: 20px;
                margin: 0 16px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .form-actions {
                flex-direction: column;
                gap: 12px;
            }

            .form-actions .btn {
                width: 100%;
                justify-content: center;
            }

            .page-header {
                flex-direction: column;
                gap: 16px;
                align-items: stretch;
            }
        }

        @media (max-width: 480px) {
            .form-card {
                padding: 16px;
                margin: 0 12px;
            }

            .input,
            .form-select {
                height: 44px;
                padding: 0 12px;
                font-size: 16px; /* Prevent zoom on iOS */
            }

            .form-textarea {
                padding: 10px 12px;
                font-size: 16px;
            }
        }
    </style>
</body>
</html>
