<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8fafc"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="200" height="400" fill="#ffffff"/>
  <rect x="0" y="0" width="200" height="400" fill="#f1f5f9" opacity="0.5"/>
  
  <!-- Logo -->
  <circle cx="40" cy="30" r="8" fill="#3b82f6"/>
  <text x="60" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">TaskFlow</text>
  
  <!-- Navigation items -->
  <rect x="20" y="60" width="160" height="40" rx="8" fill="#3b82f6" opacity="0.1"/>
  <circle cx="40" cy="80" r="4" fill="#3b82f6"/>
  <text x="60" y="85" font-family="Arial, sans-serif" font-size="12" fill="#3b82f6">Dashboard</text>
  
  <circle cx="40" cy="120" r="4" fill="#6b7280"/>
  <text x="60" y="125" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Tasks</text>
  
  <circle cx="40" cy="160" r="4" fill="#6b7280"/>
  <text x="60" y="165" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Projects</text>
  
  <!-- Main content area -->
  <rect x="220" y="20" width="360" height="360" rx="12" fill="#ffffff"/>
  <rect x="220" y="20" width="360" height="360" rx="12" fill="none" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Header -->
  <rect x="240" y="40" width="320" height="60" rx="8" fill="#f8fafc"/>
  <text x="260" y="65" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Dashboard Overview</text>
  <text x="260" y="85" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Welcome back! Here's what you need to accomplish today</text>
  
  <!-- Stats cards -->
  <rect x="240" y="120" width="70" height="80" rx="8" fill="#eff6ff"/>
  <text x="255" y="145" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#3b82f6">24</text>
  <text x="255" y="165" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Total Tasks</text>
  
  <rect x="320" y="120" width="70" height="80" rx="8" fill="#f0fdf4"/>
  <text x="335" y="145" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#10b981">18</text>
  <text x="335" y="165" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Completed</text>
  
  <rect x="400" y="120" width="70" height="80" rx="8" fill="#fef3c7"/>
  <text x="415" y="145" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f59e0b">6</text>
  <text x="415" y="165" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Pending</text>
  
  <rect x="480" y="120" width="70" height="80" rx="8" fill="#fce7f3"/>
  <text x="495" y="145" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ec4899">3</text>
  <text x="495" y="165" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Due Today</text>
  
  <!-- Task list -->
  <rect x="240" y="220" width="320" height="140" rx="8" fill="#f8fafc"/>
  <text x="260" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Recent Tasks</text>
  
  <!-- Task items -->
  <rect x="260" y="260" width="4" height="4" rx="2" fill="#3b82f6"/>
  <text x="275" y="264" font-family="Arial, sans-serif" font-size="11" fill="#1a1a1a">Complete project documentation</text>
  
  <rect x="260" y="280" width="4" height="4" rx="2" fill="#10b981"/>
  <text x="275" y="284" font-family="Arial, sans-serif" font-size="11" fill="#1a1a1a">Review pull requests</text>
  
  <rect x="260" y="300" width="4" height="4" rx="2" fill="#6b7280"/>
  <text x="275" y="304" font-family="Arial, sans-serif" font-size="11" fill="#1a1a1a">Team meeting preparation</text>
  
  <rect x="260" y="320" width="4" height="4" rx="2" fill="#f59e0b"/>
  <text x="275" y="324" font-family="Arial, sans-serif" font-size="11" fill="#1a1a1a">Update project timeline</text>
</svg>
